<text class="s" x="24" y="490">■ you maintain the</text>
<text class="s" x="24" y="508">  server: backups and</text>
<text class="s" x="24" y="526">  updates</text>
<text class="s" x="24" y="548">■ remote access</text>
<text class="s" x="24" y="566">  adds attack</text>
<text class="s" x="24" y="584">  surface</text>

