<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 716" width="960" height="716" role="img" aria-labelledby="t d">
<title id="t">Plan 2: server version (in development)</title>
<desc id="d">Planned design, not available yet. Your devices connect over Tailscale to a Linux VM on a Proxmox node. The VM runs one instance per project, each with its own firewall, volumes and sessions. They all use a shared local model through internal networks with no internet access, one per instance. A separate downloader is the only thing that reaches Hugging Face.</desc>
<style>
svg{--paper:#f2f0eb;--ink:#0a0a0a;--mute:#55534e;--box:#ffffff;--r:#e8341c}
@media (prefers-color-scheme:dark){svg{--paper:#0a0a0a;--ink:#f2f0eb;--mute:#aeaba3;--box:#171716;--r:#ff4a2e}}
text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:12px;fill:var(--ink)}
.D{font-family:"Arial Black","Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:900}
.h1{font-size:34px}.h2{font-size:20px}.h3{font-size:15px}.id{font-size:15px;font-weight:700}
.s{fill:var(--mute)}.r{fill:var(--r)}.inv{fill:var(--paper)}.w{fill:#ffffff}.yt{fill:#ffd400}.k0{fill:#0a0a0a}
.k{font-size:11px;letter-spacing:1.5px;font-weight:700}.k9{font-size:9px;letter-spacing:1px;font-weight:700}
.c{text-anchor:middle}.e{text-anchor:end}
.paper{fill:var(--paper)}.ink{fill:var(--ink)}.red{fill:var(--r)}.blk{fill:#0a0a0a}.yel{fill:#ffd400}.haz{fill:url(#peligro)}
.box{fill:var(--box);stroke:var(--ink);stroke-width:3}
.zone{fill:none;stroke:var(--ink);stroke-width:3}.zd{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:10 6}
.lim{fill:var(--box);stroke:var(--ink);stroke-width:4}.sw{stroke:var(--ink);stroke-width:2}
.f{fill:none;stroke:var(--ink);stroke-width:3}.dot{stroke-dasharray:3 6}
.tagt{fill:var(--paper);font-size:12px;font-weight:700;text-anchor:middle}
</style>
<defs>
<pattern id="peligro" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="16" height="16" fill="#ffd400"/><rect width="8" height="16" fill="#0a0a0a"/></pattern>
<marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--ink)"/></marker>
</defs>

