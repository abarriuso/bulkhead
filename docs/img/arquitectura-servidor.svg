<text class="s" x="24" y="508">  servidor: copias y</text>
<text class="s" x="24" y="526">  actualizaciones</text>
<text class="s" x="24" y="548">■ el acceso remoto</text>
<text class="s" x="24" y="566">  añade superficie</text>
<text class="s" x="24" y="584">  de ataque</text>

