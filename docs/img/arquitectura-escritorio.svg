<text class="s e" x="596" y="226">one per project</text>
<text x="268" y="248">Claude Code · OpenCode</text>
<text class="s" x="268" y="266">git · gh · Node · Python · ia menu</text>
<text x="268" y="292">■ unprivileged user</text>
<text x="268" y="310">■ can't see Windows or other projects</text>
<text x="268" y="328">■ its own sessions and ports</text>
<text x="268" y="346">■ CPU, memory and process limits</text>
<text class="D h3 r" x="268" y="378">OUTBOUND PROXY</text>
<text class="s" x="268" y="398">by domain · no DNS · won't start if it fails</text>
