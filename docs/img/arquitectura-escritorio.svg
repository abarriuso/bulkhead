<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 698" width="960" height="698" role="img" aria-labelledby="t d">
<title id="t">Plan 1: desktop version</title>
<desc id="d">On a Windows PC, Docker Desktop runs one container per project with Claude Code and OpenCode. Each one reaches the internet only through a proxy that filters by domain and lets through Anthropic, npm, PyPI, GitHub and VS Code, and it can't see the Windows drive or the other projects. The local model is served by LM Studio on Windows or by a llama.cpp container; Open WebUI offers a chat with that model. None of the three goes through the firewall.</desc>
<style>
svg{--paper:#f2f0eb;--ink:#0a0a0a;--mute:#55534e;--box:#ffffff;--r:#e8341c}
@media (prefers-color-scheme:dark){svg{--paper:#0a0a0a;--ink:#f2f0eb;--mute:#aeaba3;--box:#171716;--r:#ff4a2e}}
text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:12px;fill:var(--ink)}
.D{font-family:"Arial Black","Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:900}
.h1{font-size:34px}.h2{font-size:20px}.h3{font-size:15px}
.s{fill:var(--mute)}.r{fill:var(--r)}.inv{fill:var(--paper)}.w{fill:#ffffff}.yt{fill:#ffd400}
.k{font-size:11px;letter-spacing:1.5px;font-weight:700}.k9{font-size:9px;letter-spacing:1px;font-weight:700}
.c{text-anchor:middle}.e{text-anchor:end}
.paper{fill:var(--paper)}.ink{fill:var(--ink)}.red{fill:var(--r)}.blk{fill:#0a0a0a}.haz{fill:url(#peligro)}
.box{fill:var(--box);stroke:var(--ink);stroke-width:3}.rbox{fill:var(--r);stroke:var(--ink);stroke-width:3}
.zone{fill:none;stroke:var(--ink);stroke-width:3}.zd{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:10 6}
.lim{fill:var(--box);stroke:var(--ink);stroke-width:4}.sw{stroke:var(--ink);stroke-width:2}
.f{fill:none;stroke:var(--ink);stroke-width:3}.fr{fill:none;stroke:var(--r);stroke-width:3}.x{fill:none;stroke:var(--r);stroke-width:4}.dash{stroke-dasharray:8 6}
.tagt{fill:var(--paper);font-size:12px;font-weight:700;text-anchor:middle}
</style>
<defs>
<pattern id="peligro" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="16" height="16" fill="#ffd400"/><rect width="8" height="16" fill="#0a0a0a"/></pattern>
<marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--ink)"/></marker>
</defs>

